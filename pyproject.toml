[project]
name = "privilege-broker"
version = "0.0.0"
description = "Human-approved typed operations for AI agents, with PVE first"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = []

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.4"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
