name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check uv==0.13.7
      - name: Sync locked development tools
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run python -m pytest -q
      - name: Run the documented local example
        run: uv run python examples/pve_authorization.py

  checks-python-3-11:
    name: checks-python-3.11
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check uv==0.13.7
      - name: Sync locked development tools
        run: uv sync --frozen
      - name: Test minimum supported Python
        run: uv run python -m pytest -q
      - name: Run the documented local example
        run: uv run python examples/pve_authorization.py

  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check uv==0.13.7
      - name: Build the distribution
        run: uv build
      - name: Verify the installed wheel outside the checkout
        shell: bash
        run: |
          set -euo pipefail
          uv venv --python 3.12 "$RUNNER_TEMP/privilege-broker-wheel"
          uv pip install --python "$RUNNER_TEMP/privilege-broker-wheel/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/privilege-broker-wheel/bin/python" -I - <<'PY'
          import asyncio
          import json
          import os
          import secrets
          import tempfile
          from pathlib import Path
          from privilege_broker.pve.authorization import CertificatePolicy, LeaseSigner
          from privilege_broker.pve.service import create_broker_app_from_env

          async def verify():
              assert "source-address=198.51.100.88/32" in CertificatePolicy(source="198.51.100.88/32").to_options()
              with tempfile.TemporaryDirectory() as directory:
                  root = Path(directory)
                  key = root / "lease.pem"
                  key.write_bytes(LeaseSigner.generate().to_pem())
                  key.chmod(0o600)
                  policy = root / "policy.json"
                  policy.write_text(json.dumps({"version": 2, "grants": {"ct.reboot": [9001]}, "snapshot_retention_days": 7}))
                  os.environ.update(
                      PVE_BROKER_DATABASE=str(root / "state.sqlite3"),
                      PVE_BROKER_LEASE_KEY_PATH=str(key), PVE_BROKER_POLICY_FILE=str(policy),
                      PVE_BROKER_RP_ID="broker.example.test", PVE_BROKER_ORIGIN="https://broker.example.test",
                      PVE_BROKER_ENROLLMENT_KEY=secrets.token_urlsafe(24),
                      PVE_BROKER_CA_KEY_PATH="", PVE_BROKER_CERT_SOURCE="", PVE_BROKER_NOTIFY_WEBHOOK_FILE="",
                  )
                  app = create_broker_app_from_env()
                  async with app.router.lifespan_context(app):
                      assert "/v1/broker/requests" in {route.path for route in app.routes}
          asyncio.run(verify())
          PY

  public-content:
    name: public-content
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify pinned Gitleaks and scan history, blobs and messages
        shell: bash
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/privilege-broker-tools"
          mkdir -p "$tools"
          curl --fail --location --silent --show-error --max-time 60 \
            --max-filesize 33554432 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$tools/gitleaks.tar.gz"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$tools/gitleaks.tar.gz" | sha256sum --check -
          tar --extract --gzip --file "$tools/gitleaks.tar.gz" \
            --directory "$tools" gitleaks
          "$tools/gitleaks" git --config .gitleaks.toml --redact \
            --no-banner --log-opts='--all' .
          git ls-tree --name-only -r -z HEAD | while IFS= read -r -d '' path; do
            git show "HEAD:$path"
            printf '\n'
          done | "$tools/gitleaks" stdin --config .gitleaks.toml --redact --no-banner
          git log --all --format=%B | "$tools/gitleaks" stdin \
            --config .gitleaks.toml --redact --no-banner
      - name: Scan tree, history and messages for private identifiers
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_estate_identifiers.py
          git log --all --format= --patch | python3 scripts/check_estate_identifiers.py --stdin
          git log --all --format=%B | python3 scripts/check_estate_identifiers.py --stdin
