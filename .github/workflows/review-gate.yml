# Trusted metadata-only publisher for the required `review` commit status.
# Never run PR-head code with this write token. A review event cannot safely
# select its own workflow definition; trusted lifecycle events and the sweep
# refresh the stored status instead. Automerge independently re-reads reviews.
name: review-gate

on:
  workflow_run:
    # `review-signal` is the relay for review events: a review has no trusted trigger of its own, so a
    # no-op workflow on the head's copy starts this one from the default branch instead. Without it a fresh
    # approval is only noticed at the next schedule, which GitHub runs hours apart.
    workflows: [CI, review-signal]
    types: [completed]
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed]
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: review-gate
  cancel-in-progress: false

jobs:
  publish-review:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Evaluate complete review snapshot and publish current verdicts
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/github_pr_automation.py review --apply
