# Release automation under the repository's own merge policy: release-please
# opens one release pull request on a release-relevant conventional commit, and
# owns the version tag and the GitHub Release once that pull request merges.
# No package, container, image or deployment publisher is installed.
#
# The release pull request always changes a sensitive path (pyproject.toml, this
# configuration or the manifest), so scripts/pr_policy.py never auto-merges it.
#
# The push trigger alone is not enough: ordinary changes are merged by
# `automerge` with the default GITHUB_TOKEN, and GitHub suppresses the
# push-triggered workflows for it. The `workflow_run` trigger observes the
# completion of that trusted default-branch automation instead, and the
# `if` guard keeps it to the default branch. `workflow_dispatch` is the manual
# reconciliation path.
#
# Never restore `skip-github-release`. Release-please flips a merged release
# pull request from `autorelease: pending` to `autorelease: tagged` only in the
# release creation this input disables, and its guard against a second release
# pull request reads the label rather than the tag. A merged release pull
# request that stays pending therefore blocks every later run with "There are
# untagged, merged release PRs outstanding", and with no tag it cannot find the
# commit range or the next version either.
#
# The token is a fine-grained personal access token with Contents: write and
# Pull requests: write on this repository, stored as RELEASE_PLEASE_TOKEN. The
# default GITHUB_TOKEN cannot be used: a pull request it creates does not
# trigger the pull-request workflows, so the required checks would never run.
name: release-please

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [automerge]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Tag and release creation are writes that must not interleave; a queued run
# re-reads the tags and the labels, so cancelling one would leave a half-tagged
# release pull request behind.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    if: >-
      github.event_name != 'workflow_run'
      || github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
