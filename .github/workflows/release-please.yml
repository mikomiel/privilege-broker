# Release automation under the repository's own merge policy: release-please
# opens one release pull request on a release-relevant conventional commit.
# Tag and GitHub Release creation remain disabled until separately authorized. The release
# pull request always changes a sensitive path (pyproject.toml, this
# configuration or the manifest), so scripts/pr_policy.py never auto-merges it.
#
# The push trigger alone is not enough: ordinary changes are merged by
# `automerge` with the default GITHUB_TOKEN, and GitHub suppresses the
# push-triggered workflows for it. The `workflow_run` trigger observes the
# completion of that trusted default-branch automation instead, and the
# `if` guard keeps it to the default branch. `workflow_dispatch` is the manual
# reconciliation path.
#
# The token is a fine-grained personal access token with Contents: write and
# Pull requests: write on this repository, stored as RELEASE_PLEASE_TOKEN. The
# default GITHUB_TOKEN cannot be used: a pull request it creates does not
# trigger the pull-request workflows, so the required checks would never run.
name: release-please

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [automerge]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: >-
      github.event_name != 'workflow_run'
      || github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          skip-github-release: true
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
