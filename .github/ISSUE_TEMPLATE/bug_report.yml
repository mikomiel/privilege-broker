name: Bug report
description: Report a defect in the privilege-broker authorization library or its interfaces.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include deployment details, secrets, tokens or personal data.
        Use synthetic values and redact logs before posting.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What failed, and where.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: Commit SHA or released version
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal steps or a synthetic reproduction.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Python version and OS. Use synthetic deployment identifiers.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Optional. Redact before posting.
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I removed credentials, private addresses and deployment details from this report.
          required: true
