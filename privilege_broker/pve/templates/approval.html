<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>PVE Approval</title>
<style>
* {{ margin: 0; padding: 0; box-sizing: border-box; }}
body {{ font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }}
main {{ background: #1e293b; border-radius: 12px; padding: 2rem; max-width: 520px; width: 100%; box-shadow: 0 4px 24px rgba(0,0,0,.4); }}
h1 {{ font-size: 1.4rem; margin-bottom: 1.25rem; color: #f8fafc; }}
dl {{ display: grid; grid-template-columns: auto 1fr; gap: .5rem 1rem; margin-bottom: 1.5rem; }}
dt {{ color: #94a3b8; font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; }}
dd {{ color: #e2e8f0; font-size: .9rem; word-break: break-all; }}
#state {{ padding: .75rem 1rem; border-radius: 8px; margin-bottom: 1rem; font-size: .9rem; font-weight: 600; }}
#state.pending {{ background: #334155; color: #94a3b8; }}
#state.approved {{ background: #14532d; color: #86efac; }}
#state.denied {{ background: #7f1d1d; color: #fca5a5; }}
#state.error {{ background: #7f1d1d; color: #fca5a5; }}
.buttons {{ display: flex; gap: .75rem; }}
button {{ flex: 1; padding: .75rem; border: none; border-radius: 8px; font-size: .95rem; font-weight: 600; cursor: pointer; transition: opacity .15s; }}
button:disabled {{ opacity: .35; cursor: not-allowed; }}
#approve {{ background: #16a34a; color: #fff; }}
#approve:hover:not(:disabled) {{ background: #15803d; }}
#deny {{ background: #dc2626; color: #fff; }}
#deny:hover:not(:disabled) {{ background: #b91c1c; }}
</style>
</head>
<body>
<main>
<h1>PVE operation approval</h1>
<dl id="details"></dl>
<p id="countdown" style="margin-bottom:.5rem;font-size:.85rem;color:#94a3b8;"></p>
<p id="state" class="pending">Choose an action.</p>
<div class="buttons">
<button id="approve">Approve</button>
<button id="deny">Deny</button>
</div>
</main>
<script>
const id = {request_id};
const details = {details};
const bytes = value => Uint8Array.from(atob(value.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
const b64 = value => btoa(String.fromCharCode(...new Uint8Array(value))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const labels = {{action: 'Action', ct_id: 'CT', reason: 'Reason', requester: 'Requester (self-declared)', self_reported_hostname: 'Self-reported hostname', mtls_identity: 'mTLS identity (verified)', observed_source_ip: 'Source IP', ssh_fingerprint: 'SSH public key fingerprint', digest: 'Request digest', expires_at: 'Expires', effect: 'Effect'}};
const list = document.getElementById('details');
Object.entries(details).forEach(([key, value]) => {{ const term = document.createElement('dt'); const description = document.createElement('dd'); term.textContent = labels[key]; description.textContent = key === 'expires_at' ? new Date(value * 1000).toLocaleString() : value; list.append(term, description); }});

const stateEl = document.getElementById('state');
const approveBtn = document.getElementById('approve');
const denyBtn = document.getElementById('deny');

function setFinal(className, text) {{
  clearInterval(pollTimer);
  clearInterval(countdownTimer);
  stateEl.className = className;
  stateEl.textContent = text;
  approveBtn.disabled = true;
  denyBtn.disabled = true;
}}

let pollTimer = setInterval(async () => {{
  try {{
    const r = await fetch(`/v1/broker/requests/${{id}}/status`);
    if (!r.ok) return;
    const data = await r.json();
    if (data.status === 'approved') {{ clearInterval(pollTimer); clearInterval(countdownTimer); setFinal('approved', 'Approved. PVE operation can proceed.'); }}
    else if (data.status === 'denied') {{ clearInterval(pollTimer); clearInterval(countdownTimer); setFinal('denied', 'Denied. No action will run.'); }}
    else if (data.status === 'cancelled' || data.status === 'expired') {{ clearInterval(pollTimer); clearInterval(countdownTimer); setFinal('denied', (data.status.charAt(0).toUpperCase() + data.status.slice(1)) + '. No action will run.'); }}
  }} catch (e) {{ /* ignore network errors */ }}
}}, 3000);

const expiresAt = {expires_at};
function updateCountdown() {{
  const remaining = Math.max(0, Math.floor((expiresAt * 1000 - Date.now()) / 1000));
  const min = Math.floor(remaining / 60);
  const sec = remaining % 60;
  document.getElementById('countdown').textContent = remaining > 0 ? `Expires in ${{min}}:${{String(sec).padStart(2, '0')}}` : 'Expired';
  if (remaining <= 0) {{
    clearInterval(countdownTimer);
    approveBtn.disabled = true;
    denyBtn.disabled = true;
  }}
}}
let countdownTimer = setInterval(updateCountdown, 1000);
updateCountdown();

const decide = async decision => {{
  clearInterval(pollTimer);
  clearInterval(countdownTimer);
  if (decision === 'denial') {{
    try {{
      const result = await fetch(`/v1/broker/requests/${{id}}/denial`, {{method: 'POST'}});
      if (!result.ok) throw new Error('denial failed');
      setFinal('denied', 'Denied. No action will run.');
    }} catch (error) {{ setFinal('error', 'Denial failed.'); }}
    return;
  }}
  stateEl.className = 'pending';
  stateEl.textContent = 'Waiting for passkey confirmation...';
  approveBtn.disabled = true;
  denyBtn.disabled = true;
  try {{
    const options = await fetch(`/v1/broker/requests/${{id}}/approval/options`).then(r => r.json());
    options.challenge = bytes(options.challenge); options.allowCredentials.forEach(c => c.id = bytes(c.id));
    const credential = await navigator.credentials.get({{publicKey: options}});
    const payload = {{id: credential.id, rawId: b64(credential.rawId), type: credential.type, response: {{
      authenticatorData: b64(credential.response.authenticatorData), clientDataJSON: b64(credential.response.clientDataJSON), signature: b64(credential.response.signature), userHandle: credential.response.userHandle ? b64(credential.response.userHandle) : null
    }}}};
    const result = await fetch(`/v1/broker/requests/${{id}}/${{decision}}`, {{method: 'POST', headers: {{'Content-Type': 'application/json'}}, body: JSON.stringify({{credential: payload}})}});
    if (!result.ok) throw new Error('decision rejected');
    setFinal('approved', 'Approved. PVE operation can proceed.');
  }} catch (error) {{ setFinal('error', 'Passkey challenge was not completed.'); }}
}};
document.getElementById('approve').onclick = () => decide('approval');
document.getElementById('deny').onclick = () => decide('denial');
</script>
</body>
</html>
